# An exploration started over the link and stopped over it a tenth of a second into the run, as
# micras-monitor's STOP does. The stop cuts the motor drivers, so the robot coasts to rest.
robot = "micras"
arena = "maze1"
seconds = 8
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "explore"

[[events]]
at = 3.6
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 6.0
