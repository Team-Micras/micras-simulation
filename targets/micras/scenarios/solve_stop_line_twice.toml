# The whole contest with the racing line and the fan, stopped over the radio in the fastest run as
# the line bends at 3 m/s, and stopped again 50 ms into the brake: the second stop drops the brake
# along the racing line and ramps the wheels to rest, whatever the bend does to the path. The time is
# absolute and only lands on that bend because the run is reproducible; the stop speed of the
# baseline shows that it still does. A row every millisecond keeps the 90 s of the run small.
robot = "micras"
arena = "maze1"
seconds = 100
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.1
set = "dip_fan"
value = true

[[events]]
at = 0.1
set = "dip_racing_line"
value = true

[[events]]
at = 0.5
press = "button"
for = 0.25

[[events]]
at = 5.0
when = "state"
equals = "IDLE"
press = "button"
for = 1.0

[[events]]
at = 89.95
when = "state"
equals = "RUN"
send = "stop"

[[events]]
at = 90.0
send = "stop"

[stop]
when = "state"
equals = "IDLE"
after = 91.0
abort = "ERROR"
