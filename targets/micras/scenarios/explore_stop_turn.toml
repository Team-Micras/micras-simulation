# An exploration stopped over the radio halfway through a search turn, at the speed of the turn:
# the robot brakes along the curve with what its bending leaves of the grip.
robot = "micras"
arena = "maze1"
seconds = 11
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "explore"

[[events]]
at = 7.09
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 8.1
