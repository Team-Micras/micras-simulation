# An exploration stopped over the radio on a straight at its top speed, 1 m/s, a few tenths of a
# second before it slows for the next turn: the robot brakes along the path it was following.
robot = "micras"
arena = "maze1"
seconds = 12
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "explore"

[[events]]
at = 8.81
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 9.8
