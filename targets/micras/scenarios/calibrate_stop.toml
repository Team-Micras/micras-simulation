# The calibration of the wall sensors asked for over the radio, with every switch off, and stopped
# while the side sensors are measured: the calibration is cancelled and the robot is idle.
robot = "micras"
arena = "maze1"
seconds = 6
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "calibrate"

[[events]]
at = 0.5
when = "state"
equals = "CALIBRATE"
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 4.5
