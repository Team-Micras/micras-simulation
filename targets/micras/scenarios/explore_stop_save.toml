# An exploration stopped over the radio in the one iteration the firmware spends in SAVE, as it
# writes the map after reaching the goal. The stop waits for the save and then makes the robot idle
# instead of sending it back to the start. The time is set to the tick: the stop arrives a
# millisecond after it is sent, and the state sequence of the baseline, SAVE then IDLE and not
# WAIT_FOR_RUN, shows that it still lands there.
robot = "micras"
arena = "maze1"
seconds = 30
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "explore"

[[events]]
at = 26.9144
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 27.9
