# An exploration stopped over the radio on a straight at its top speed, 1 m/s, and stopped again a
# tenth of a second into the brake, at half that speed: the second stop does not wait for the brake,
# it turns the motors off at once and the robot coasts to rest, about 0.25 m and a second later.
robot = "micras"
arena = "maze1"
seconds = 12
seed = 1

# Where the firmware expects to be placed (constants.hpp start_offset): its origin
# about 40 mm in front of the face of the back wall, the board clear of it.
[start]
x = 0.09
y = 0.0463
yaw_deg = 90.0

[[events]]
at = 0.5
send = "explore"

[[events]]
at = 8.81
send = "stop"

[[events]]
at = 8.91
send = "stop"

[stop]
when = "state"
equals = ["IDLE", "ERROR"]
after = 10.8
